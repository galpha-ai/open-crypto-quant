[package]
name = "trade_server"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.93"
async-trait = "0.1.83"
chrono = { version = "0.4.38", features = ["serde"] }
clap = { version = "4.5.21", features = ["derive"] }
serde = { version = "1.0.215", features = ["derive"] }
tokio = { version = "1.41.1", features = ["full"] }
futures = "0.3"
tracing = "0.1.41"
serde_json = "1.0.133"
tracing-subscriber = { version = "0.3.19", features = ["env-filter", "json", "time"] }
thiserror = "2.0.3"
redis = { version = "0.27.3", features = ["aio", "tokio-comp"] }
teloxide = "0.13.0"
mockall = "0.13.1"
float-cmp = "0.10.0"
glob-match = "0.2"
reqwest = { version = "0.12.12", features = ["json"] }
solana-client = "2.1.9"
solana-sdk = "2.1.9"
bincode = "1.3.3"
hex = "0.4.3"
bs58 = "0.5.1"
tokio-retry2 = "0.5.6"
solana-transaction-status-client-types = "2.1.10"
solana-signature = "2.1.10"
base64 = "0.22.1"
popeyes_trading_types = { version = "0.3.3" }
serde_yaml = "0.9.34"
prometheus = "0.13.4"
warp = "0.3.7"
jito-sdk-rust = "0.1.0"
yellowstone-grpc-proto = "5.0.0"
uuid = { version = "1.16.0", features = ["v4"] }
hostname = "0.4"
once_cell = "1.21.3"
spl-token = "7.0.0"
solana-account-decoder-client-types = "2.1.15"
tracing-test = "0.2.5"
solana-sub = { path = "../tx-sub/crates/solana-sub" }
http-client-unix-domain-socket = "0.1.1"
galpha-proto = { path = "../proto" }
tx-sub-common = { path = "../tx-sub/crates/common", package = "common" }
parquet = { version = "54.0", default-features = false, features = ["arrow", "snap"] }
arrow = { version = "54.0", default-features = false, features = ["json"] }
humantime-serde = "1.1.1"
polyfill-rs = { path = "../polyfill-rs" }
rust_decimal = "1.36"
alloy-primitives = "0.8.26"
alloy-sol-types = "0.8.26"
alloy-signer = { version = "0.7", features = ["eip712"] }
alloy-signer-local = { version = "0.7", features = ["eip712"] }
alloy-provider = "0.7"
alloy-network = "0.7"
alloy-transport-http = "0.7"
alloy-rpc-types = "0.7"
tokio-tungstenite = { version = "0.24", features = ["native-tls"] }
futures-util = "0.3"
url = "2.5"
native-tls = "0.2"
rand = "0.8"

[lib]
name = "trade_server"
path = "src/lib.rs"
crate-type = ["lib"]

[[example]]
name = "trade_server"
path = "examples/trade_server.rs"

[features]

[dev-dependencies]
tempfile = "3.23.0"
shellexpand = "3.1"
