# Example holdings file consumed by `stock-scoring sell`.
positions:
  - ticker: NVDA
    quality_percentile: 0.98
    price_percentile: 0.95
    days_below_quality: 0
    days_below_price: 0
    catalyst_news: false
    manual_override: false

  - ticker: TSM
    quality_percentile: 0.82    # dropped out of top 10% quality
    price_percentile: 0.85
    days_below_quality: 10      # past 7-day grace period → will trigger
    days_below_price: 0

  - ticker: VRT
    quality_percentile: 0.91
    price_percentile: 0.70      # dropped out of top 20% price rank
    days_below_quality: 0
    days_below_price: 20        # past 14-day grace period → will trigger

  - ticker: AVGO
    quality_percentile: 0.94
    price_percentile: 0.88
    catalyst_news: true         # immediate sell
