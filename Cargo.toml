[workspace]
members = [
    "crates/trade-server",
    "crates/poly-strat-starter",
    "crates/ingester",
    "crates/tx-sub/crates/common",
    "crates/tx-sub/crates/solana-sub",
    "crates/tx-sub/crates/polymarket-sub",
    "crates/tx-sub/crates/spot-price-sub",
    "crates/proto",
    "crates/polyfill-rs",
]
resolver = "2"

[workspace.dependencies]
# Internal crates
trade_server = { path = "crates/trade-server" }
common = { path = "crates/tx-sub/crates/common" }
solana-sub = { path = "crates/tx-sub/crates/solana-sub" }
galpha-proto = { path = "crates/proto" }
polyfill-rs = { path = "crates/polyfill-rs" }

# Shared core dependencies
redis = { version = "0.27.3", features = ["aio", "tokio-comp", "connection-manager"] }
tokio = { version = "1.41.1", features = ["full"] }
prometheus = "0.13.4"
serde = { version = "1.0.215", features = ["derive"] }
serde_json = "1.0.133"
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.19", features = ["env-filter", "json", "time"] }
anyhow = "1.0.93"
thiserror = "2.0.3"

# Additional shared dependencies
async-trait = "0.1.83"
chrono = { version = "0.4.38", features = ["serde"] }
clap = { version = "4.5.21", features = ["derive"] }
serde_yaml = "0.9.34"
warp = "0.3.7"

# Solana-specific dependencies
yellowstone-grpc-client = "5.0.0"
yellowstone-grpc-proto = "5.0.0"
solana-sdk = "2.1.15"
solana-transaction-status-client-types = "2.1.9"
solana-program = "2.1.10"
solana-rpc-client = "2.1.16"
solana-client = "~2.1"
spl-token = { version = "7.0.0", features = ["no-entrypoint"] }
spl-associated-token-account = { version = "6.0.0", features = ["no-entrypoint"] }
serum_dex = { version = "0.5.4", features = ["no-entrypoint"] }

# Data handling dependencies
borsh = "1.5.5"
bs58 = "0.5.1"
hex = "0.4.3"
base64 = "0.22.1"
bincode = { version = "1.3.3", features = ["i128"] }
bytemuck = { version = "1.22.0", features = ["align_offset", "alloc_uninit", "const_zeroed", "derive", "unsound_ptr_pod_impl", "zeroable_atomics", "zeroable_maybe_uninit"] }
safe-transmute = "0.11.3"
serde_bytes = "0.11.17"

# Utility dependencies
futures-util = "0.3.31"
rustls = "0.23.23"
clickhouse = { version = "0.13.2", features = ["chrono", "rustls-tls", "rustls-tls-ring", "time"] }
time = "0.3.40"
u128 = "0.1.0"
num-traits = { version = "0.2.19", features = ["i128"] }
once_cell = "1.21.3"
num-derive = "0.4.2"
arrayref = "0.3.9"
arrform = "0.1.1"
uint = "0.10.0"
isahc = { version = "1.7.2", features = ["serde"] }

popeyes_trading_types = "0.3.3"

# HTTP client for API calls
reqwest = { version = "0.12", features = ["json", "rustls-tls"] }

# Tokio utilities
tokio-util = "0.7"
