[project]
name = "poly-data"
version = "0.1.0"
description = "Backtest data management CLI"
requires-python = ">=3.12"
dependencies = [
    "duckdb>=1.0.0",
    "pyyaml>=6.0.3",
]

[project.scripts]
poly-data = "poly_data.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/poly_data"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
