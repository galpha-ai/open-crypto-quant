[package]
name = "ingester"
version = "0.1.0"
edition = "2024"

[dependencies]
tx_sub = { path = "../tx-sub/crates/common", package = "common" }
anyhow = "1.0.93"
chrono = { version = "0.4.38", features = ["serde"] }
clap = { version = "4.5.21", features = ["derive"] }
redis = { version = "0.27.3", features = ["aio", "tokio-comp", "connection-manager"] }
clickhouse = { version = "0.13.2", features = ["time", "rustls-tls"] }
serde = { version = "1.0.215", features = ["derive"] }
time = "0.3.40"
tokio = { version = "1.41.1", features = ["full"] }
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.19", features = ["env-filter", "json", "time"] }
rustls = "0.23.23"
rustls-webpki = "0.102"
serde_yaml = "0.9.34"
thiserror = "2.0.11"
tokio-util = "0.7.18"

[[bin]]
name = "ingester"
path = "src/main.rs"
